<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Nwanosike Chinonso Amos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Login Screen */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 20px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn.primary {
            background: var(--primary);
            color: white;
        }

        .btn.primary:hover {
            background: var(--primary-hover);
        }

        .btn.danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Dashboard Container */
        #dashboard {
            display: none;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-weight: 600;
            font-size: 24px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-weight: 500;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* List Items */
        .item-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .item-desc {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .item-meta {
            margin-top: 8px;
            font-size: 12px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .action-icon {
            cursor: pointer;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.2s;
        }

        .action-icon:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .action-icon.delete:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Editor Panel */
        .editor-panel {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 20px;
        }

        .editor-header {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .file-upload-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed var(--border);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .file-upload-btn:hover {
            border-color: var(--primary);
            color: white;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .upload-status {
            font-size: 13px;
            margin-top: 10px;
            color: var(--success);
            display: none;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Global Loading Curtain */
        #global-loader {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #global-loader p {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 14px;
        }

        #global-loader .loader {
            width: 40px;
            height: 40px;
            border-width: 3px;
            display: block;
            border-top-color: var(--primary);
        }
    </style>
</head>

<body>

    <!-- Global Loading Overlay -->
    <div id="global-loader">
        <div class="loader"></div>
        <p id="loader-text">Loading...</p>
    </div>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Admin Login</h2>
            <p style="color:var(--text-muted); margin-bottom:20px; font-size:14px;">Please enter your admin password.
            </p>
            <div class="input-group">
                <input type="password" id="admin-pass" placeholder="Enter Password"
                    onkeypress="if(event.key==='Enter') login()">
            </div>
            <button class="btn primary" id="login-btn" onclick="login()">Login <div class="loader" id="login-loader">
                </div></button>
            <p id="login-error" style="color:var(--danger); font-size:13px; margin-top:15px; display:none;">Invalid
                Password</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <div class="header">
            <h1>Content Manager</h1>
            <div style="display:flex; gap: 15px;">
                <button class="btn primary" onclick="showEditor()">+ Add New Item</button>
                <button class="btn danger" onclick="logout()" style="width:auto;"><i data-lucide="log-out"
                        style="width:16px;"></i> Logout</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('publications')">Publications</button>
            <button class="tab-btn" onclick="switchTab('experiences')">Experience</button>
            <button class="tab-btn" onclick="switchTab('skills')">Skills</button>
            <button class="tab-btn" onclick="switchTab('awards')">Awards</button>
        </div>

        <!-- Render List Container -->
        <div id="list-container"></div>

        <!-- Editor Panel -->
        <div class="editor-panel" id="editor-panel" style="display:none;">
            <div class="editor-header">
                <span id="editor-title">Add New Item</span>
                <button class="action-icon" style="background:transparent;" onclick="hideEditor()"><i
                        data-lucide="x"></i></button>
            </div>

            <form id="editor-form" onsubmit="saveItem(event)">
                <input type="hidden" id="edit-id">

                <div class="input-group" id="group-title">
                    <label>Title / Role / Tool Name</label>
                    <input type="text" id="item-title" required>
                </div>

                <div class="input-group" id="group-subtitle" style="display:none;">
                    <label>Company / Institution (For Experience/Awards)</label>
                    <input type="text" id="item-subtitle">
                </div>

                <div class="input-group" id="group-desc">
                    <label>Description</label>
                    <textarea id="item-desc" rows="3"></textarea>
                </div>

                <div class="input-group" id="group-icon" style="display:none;">
                    <label>Icon Name (lucide.dev - e.g. briefcase, file-text)</label>
                    <input type="text" id="item-icon" value="briefcase">
                </div>

                <div class="input-group" id="group-upload" style="display:none;">
                    <label>File Attachment (PDF, Images limit 4MB)</label>
                    <div class="file-upload-wrapper">
                        <div class="file-upload-btn" id="upload-btn-ui">
                            <i data-lucide="upload-cloud" style="width:32px; height:32px; margin-bottom:10px;"></i><br>
                            Click to Select File or Drag & Drop
                        </div>
                        <input type="file" id="item-file" onchange="uploadFile(this)">
                    </div>
                    <div class="upload-status" id="upload-status">File uploaded successfully!</div>
                    <input type="hidden" id="item-file-url">
                </div>

                <button type="submit" class="btn primary" id="save-btn" style="margin-top:20px;">Save Content <div
                        class="loader" id="save-loader"></div></button>
            </form>
        </div>
    </div>

    <script>
        let globalData = { publications: [], experiences: [], skills: [], awards: [] };
        let currentTab = 'publications';

        // Utility: Show Global Loader
        function showLoader(text) {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('global-loader').style.display = 'flex';
        }
        function hideLoader() { document.getElementById('global-loader').style.display = 'none'; }

        async function login() {
            const pass = document.getElementById('admin-pass').value;
            if (!pass) return;
            document.getElementById('login-loader').style.display = 'block';

            try {
                const res = await fetch('/api/admin-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                if (res.ok) {
                    sessionStorage.setItem('adminToken', pass);
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadData();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch (e) {
                alert('Connection error');
            }
            document.getElementById('login-loader').style.display = 'none';
        }

        function logout() {
            sessionStorage.removeItem('adminToken');
            location.reload();
        }

        async function loadData() {
            showLoader('Fetching Database...');
            try {
                const res = await fetch('/api/content');
                if (res.ok) {
                    globalData = await res.json();
                    renderList();
                }
            } catch (e) {
                alert('Failed to load data.');
            }
            hideLoader();
        }

        async function saveData() {
            const token = sessionStorage.getItem('adminToken');
            showLoader('Saving to Cloud...');
            try {
                const res = await fetch('/api/content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ section: currentTab, data: globalData[currentTab] })
                });
                if (res.ok) {
                    renderList();
                    hideEditor();
                } else alert('Failed to save.');
            } catch (e) { alert('Network error'); }
            hideLoader();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            hideEditor();
            renderList();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            const data = globalData[currentTab] || [];

            if (data.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:30px;">No items found for ${currentTab}.</p>`;
                return;
            }

            container.innerHTML = data.map((item, index) => `
                <div class="item-card">
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        ${item.subtitle ? `<div class="item-meta"><i data-lucide="map-pin" style="width:14px;height:14px;"></i> ${item.subtitle}</div>` : ''}
                        <div class="item-desc" style="margin-top:6px;">${item.desc.substring(0, 100)}${item.desc.length > 100 ? '...' : ''}</div>
                        ${item.fileUrl ? `<div class="item-meta" style="color:var(--success);"><i data-lucide="link" style="width:14px;height:14px;"></i> File Uploaded</div>` : ''}
                    </div>
                    <div class="item-actions">
                        <button class="action-icon" onclick="editItem(${index})"><i data-lucide="edit-2"></i></button>
                        <button class="action-icon delete" onclick="deleteItem(${index})"><i data-lucide="trash-2"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function adaptEditorForTab() {
            document.getElementById('group-subtitle').style.display = (currentTab === 'experiences' || currentTab === 'awards') ? 'block' : 'none';
            document.getElementById('group-upload').style.display = (currentTab === 'publications' || currentTab === 'awards') ? 'block' : 'none';
            document.getElementById('group-icon').style.display = (currentTab === 'skills' || currentTab === 'awards' || currentTab === 'publications') ? 'block' : 'none';
        }

        function showEditor(item = null, index = -1) {
            document.getElementById('editor-panel').style.display = 'block';
            document.getElementById('list-container').style.display = 'none';
            adaptEditorForTab();

            document.getElementById('upload-status').style.display = 'none';
            document.getElementById('upload-btn-ui').style.borderColor = 'var(--border)';

            if (item) {
                document.getElementById('editor-title').innerText = 'Edit Item';
                document.getElementById('edit-id').value = index;
                document.getElementById('item-title').value = item.title || '';
                document.getElementById('item-subtitle').value = item.subtitle || '';
                document.getElementById('item-desc').value = item.desc || '';
                document.getElementById('item-icon').value = item.icon || 'briefcase';
                document.getElementById('item-file-url').value = item.fileUrl || '';
                if (item.fileUrl) {
                    document.getElementById('upload-btn-ui').style.borderColor = 'var(--success)';
                    document.getElementById('upload-status').innerText = 'File already uploaded!';
                    document.getElementById('upload-status').style.display = 'block';
                }
            } else {
                document.getElementById('editor-title').innerText = 'Add New Item';
                document.getElementById('editor-form').reset();
                document.getElementById('edit-id').value = '';
                document.getElementById('item-file-url').value = '';
            }
        }

        function hideEditor() {
            document.getElementById('editor-panel').style.display = 'none';
            document.getElementById('list-container').style.display = 'block';
        }

        function editItem(index) {
            showEditor(globalData[currentTab][index], index);
        }

        function deleteItem(index) {
            if (confirm('Are you sure you want to delete this item?')) {
                globalData[currentTab].splice(index, 1);
                saveData();
            }
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;

            showLoader('Uploading File to Vercel Blob...');
            const token = sessionStorage.getItem('adminToken');
            try {
                const res = await fetch(`/api/upload?filename=${encodeURIComponent(file.name)}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: file
                });
                const data = await res.json();
                if (res.ok && data.url) {
                    document.getElementById('item-file-url').value = data.url;
                    document.getElementById('upload-btn-ui').style.borderColor = 'var(--success)';
                    document.getElementById('upload-status').innerText = `Uploaded: ${file.name}`;
                    document.getElementById('upload-status').style.display = 'block';
                } else {
                    alert('Upload failed: ' + (data.error || 'Unknown error'));
                }
            } catch (e) { alert('Upload error'); }
            hideLoader();
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('edit-id').value;
            const item = {
                title: document.getElementById('item-title').value,
                desc: document.getElementById('item-desc').value,
                id: Date.now().toString()
            };

            if (currentTab === 'experiences' || currentTab === 'awards') item.subtitle = document.getElementById('item-subtitle').value;
            if (currentTab === 'skills' || currentTab === 'awards' || currentTab === 'publications') item.icon = document.getElementById('item-icon').value;
            if (currentTab === 'publications' || currentTab === 'awards') item.fileUrl = document.getElementById('item-file-url').value;

            if (id !== '') {
                // Keep same ID
                item.id = globalData[currentTab][parseInt(id)].id;
                globalData[currentTab][parseInt(id)] = item;
            } else {
                if (!globalData[currentTab]) globalData[currentTab] = [];
                globalData[currentTab].unshift(item); // Add to top
            }

            saveData();
        }

        lucide.createIcons();
    </script>
</body>

</html>
